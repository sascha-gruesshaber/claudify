name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The fragment mechanism is the whole portability guarantee, so it is the gate.
      - name: fragments are in sync
        working-directory: plugins/lifecycle
        run: node skills/_shared/tools/skills.mjs check

      - name: fragment tooling tests
        working-directory: plugins/lifecycle
        run: node --test "skills/_shared/tools/skills.test.mjs"

      - name: every manifest parses
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok  $f"
          done

      - name: marketplace and plugin versions agree
        run: |
          node -e '
            const fs = require("fs")
            const mk = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"))
            let bad = 0
            for (const p of mk.plugins) {
              const manifest = JSON.parse(fs.readFileSync(`${p.source}/.claude-plugin/plugin.json`, "utf8"))
              if (manifest.version !== p.version) {
                console.error(`  x ${p.name}: marketplace says ${p.version}, manifest says ${manifest.version}`)
                bad = 1
              } else {
                console.log(`  ok ${p.name} ${p.version}`)
              }
            }
            // The cache is keyed on the marketplace copy, so a mismatch never reaches a consumer.
            process.exit(bad)
          '

      # A repo-specific command inside a skill is the one defect that makes the plugin unusable
      # elsewhere. Examples inside templates/ are the point of templates, so they are excluded.
      - name: no repo-specific commands leaked into the skills
        run: |
          hits=$(grep -rniE '(^|[^a-z])(dotnet (build|test|format|run)|npm run (lint|build)|cargo (build|test)|gradlew|mvn )' \
            plugins/lifecycle/skills plugins/lifecycle/agents \
            --exclude-dir=templates || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "A skill named a concrete build command. Point at .agents/gates.md instead."
            exit 1
          fi
          echo "clean — no build commands hard-coded"

      - name: every skill has a name and a description
        run: |
          node -e '
            const fs = require("fs"), path = require("path")
            let bad = 0
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) =>
              e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)])
            const docs = walk("plugins").filter((p) =>
              (p.endsWith("SKILL.md") || p.includes("/agents/")) && !p.includes("/templates/"))
            for (const f of docs) {
              const head = fs.readFileSync(f, "utf8").split("---")[1] ?? ""
              for (const key of ["name:", "description:"]) {
                if (!head.includes(key)) { console.error(`  x ${f} has no ${key}`); bad = 1 }
              }
            }
            console.log(`checked ${docs.length} skill and agent definitions`)
            process.exit(bad)
          '

      # A command is a slash command, so a missing description leaves it unexplained in /help.
      - name: every command has a description, and forwards to a skill that exists
        run: |
          node -e '
            const fs = require("fs"), path = require("path")
            let bad = 0
            const dir = "plugins/lifecycle/commands"
            if (!fs.existsSync(dir)) { console.log("no commands"); process.exit(0) }
            for (const name of fs.readdirSync(dir).filter((f) => f.endsWith(".md"))) {
              const text = fs.readFileSync(path.join(dir, name), "utf8")
              if (!(text.split("---")[1] ?? "").includes("description:")) {
                console.error(`  x ${name} has no description`); bad = 1
              }
              // The command is a thin forwarder, so the skill it names must be real.
              const m = text.match(/`([a-z-]+)` skill/)
              if (m && !fs.existsSync(`plugins/lifecycle/skills/${m[1]}/SKILL.md`)) {
                console.error(`  x ${name} forwards to skill "${m[1]}", which does not exist`); bad = 1
              }
              if (!bad) console.log(`  ok ${name}${m ? ` -> ${m[1]}` : ""}`)
            }
            process.exit(bad)
          '
